services:
  - type: web
    name: schoolbuddy-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    plan: free
    nodeVersion: 20.x

    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # API auth secret — must match VITE_API_SECRET on the frontend
      # Generate with: openssl rand -hex 32
      - key: API_SECRET
        sync: false
      # Turso persistent database — set these in the Render dashboard
      # (do NOT commit actual values here)
      - key: TURSO_DB_URL
        sync: false   # marks as a secret — Render will prompt you to fill it in
      - key: TURSO_DB_TOKEN
        sync: false